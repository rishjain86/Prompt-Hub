name: Build APK & Generate Keystore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Initialize Project & Config
      run: |
        npm init -y
        cat <<EOF > capacitor.config.json
        {
          "appId": "com.prompthub.app",
          "appName": "Prompt Hub",
          "webDir": "www",
          "bundledWebRuntime": false,
          "plugins": {
            "SplashScreen": {
              "launchShowDuration": 0,
              "launchAutoHide": true,
              "backgroundColor": "#0f172a",
              "androidSplashResourceName": "splash",
              "androidScaleType": "CENTER_CROP",
              "showSpinner": false
            },
            "GoogleAuth": {
              "scopes": ["profile", "email"],
              "serverClientId": "242493810474-us5ib99pnjj9of6p3iov9hd6n8ltm975.apps.googleusercontent.com",
              "forceCodeForRefreshToken": true
            }
          }
        }
        EOF

    - name: Install NPM & Capacitor Dependencies
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen
        npm install @codetrix-studio/capacitor-google-auth
        npm install -D @capacitor/assets

    - name: Prepare Web Directory (www)
      run: |
        mkdir -p www
        cp index.html style.css script.js prompts.json www/
        cp -r assets www/assets || true
        # Jap Counter Trick - Splash image ko root mein copy karna
        cp assets/splash.png www/splash.png || true
        cp assets/Splash.png www/splash.png || true
        cp assets/splash.jpg www/splash.jpg || true

    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Setup Firebase & Inject Keys Safely
      run: |
        cp google-services.json android/app/ || true
        
        # Inject AdMob (Safe Method)
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|g' $MANIFEST_PATH
        
        # 100% Safe way to inject Google Auth Client ID (Nayi XML file banegi, koi crash nahi hoga)
        mkdir -p android/app/src/main/res/values
        cat <<EOF > android/app/src/main/res/values/custom_strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="server_client_id">242493810474-us5ib99pnjj9of6p3iov9hd6n8ltm975.apps.googleusercontent.com</string>
        </resources>
        EOF

    - name: Generate App Icons & Splash Screen
      run: |
        npx @capacitor/assets generate --android

    - name: Generate New Keystore
      run: |
        keytool -genkey -v -keystore prompthub.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prompthub-alias -dname "CN=Prompt Hub, OU=App, O=Rishit, L=India, C=IN" -storepass "prompt123" -keypass "prompt123"

    - name: Print Keystore SHA-1 and SHA-256
      run: |
        keytool -list -v -keystore prompthub.jks -alias prompthub-alias -storepass prompt123

    - name: Build Unsigned APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Align and Sign APK (V2/V3 Signature)
      run: |
        BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
        $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk PromptHub-Aligned.apk
        $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks prompthub.jks --ks-pass pass:prompt123 --ks-key-alias prompthub-alias --key-pass pass:prompt123 --out PromptHub-Live.apk PromptHub-Aligned.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PromptHub-Signed-APK
        path: PromptHub-Live.apk

    - name: Upload Keystore Artifact (SAVE TO DRIVE)
      uses: actions/upload-artifact@v4
      with:
        name: PromptHub-Keystore
        path: prompthub.jks
        
