name: Build APK & Generate Keystore

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NPM & Capacitor Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen
        npm install -D @capacitor/assets

    - name: Prepare Web Directory (www)
      run: |
        mkdir -p www
        cp index.html style.css script.js prompts.json www/
        cp -r assets www/assets || true

    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Inject AdMob App ID into Manifest
      run: |
        MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
        # Google ka Test App ID inject kar rahe hain taaki crash na ho
        sed -i 's|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>\n    </application>|g' $MANIFEST_PATH

    - name: Generate App Icons & Splash Screen
      run: |
        npx @capacitor/assets generate --android

    - name: Generate New Keystore
      run: |
        keytool -genkey -v -keystore prompthub.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prompthub-alias -dname "CN=Prompt Hub, OU=App, O=Rishit, L=India, C=IN" -storepass "prompt123" -keypass "prompt123"

    - name: Build Unsigned APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Align and Sign APK (V2/V3 Signature)
      run: |
        BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
        $ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk PromptHub-Aligned.apk
        $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign --ks prompthub.jks --ks-pass pass:prompt123 --ks-key-alias prompthub-alias --key-pass pass:prompt123 --out PromptHub-Live.apk PromptHub-Aligned.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PromptHub-Signed-APK
        path: PromptHub-Live.apk

    - name: Upload Keystore Artifact (SAVE TO DRIVE)
      uses: actions/upload-artifact@v4
      with:
        name: PromptHub-Keystore
        path: prompthub.jks
        
