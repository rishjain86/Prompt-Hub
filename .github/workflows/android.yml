name: Build APK & Generate Keystore

on:
  workflow_dispatch: # Isse aap manually GitHub Actions tab se build run kar payenge

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Setup Java JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install NPM & Capacitor Dependencies
      run: |
        npm install
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/splash-screen
        npm install -D @capacitor/assets

    - name: Add Android Platform & Sync
      run: |
        npx cap add android || true
        npx cap sync android

    - name: Generate App Icons & Splash Screen
      run: |
        npx @capacitor/assets generate --android

    - name: Generate New Keystore
      run: |
        keytool -genkey -v -keystore prompthub.jks -keyalg RSA -keysize 2048 -validity 10000 -alias prompthub-alias -dname "CN=Prompt Hub, OU=App, O=Rishit, L=India, C=IN" -storepass "prompt123" -keypass "prompt123"

    - name: Build Unsigned APK via Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK with Jarsigner
      run: |
        jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore prompthub.jks -storepass "prompt123" android/app/build/outputs/apk/release/app-release-unsigned.apk prompthub-alias
        mv android/app/build/outputs/apk/release/app-release-unsigned.apk PromptHub-Live.apk

    - name: Upload Signed APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: PromptHub-Signed-APK
        path: PromptHub-Live.apk

    - name: Upload Keystore Artifact (SAVE TO DRIVE)
      uses: actions/upload-artifact@v3
      with:
        name: PromptHub-Keystore
        path: prompthub.jks
        
