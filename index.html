<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prompt Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="brand">
            <img src="assets/icon.png" alt="Logo" class="logo" onerror="this.style.display='none'">
            <h1>Prompt Hub</h1>
        </div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search prompts..." autocomplete="off">
        </div>
    </header>

    <nav class="category-filter" id="categoryFilter">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Coding & Tech">Coding & Tech</button>
        <button class="filter-btn" data-category="Marketing & Social Media">Marketing</button>
        <button class="filter-btn" data-category="Copywriting & Content">Copywriting</button>
        <button class="filter-btn" data-category="AI Art & Image Gen">AI Art</button>
        <button class="filter-btn" data-category="Video & Animation">Video</button>
        <button class="filter-btn" data-category="Business & Finance">Business</button>
        <button class="filter-btn" data-category="Lifestyle & Automation">Lifestyle</button>
        <button class="filter-btn" data-category="SEO & Website Ranking">SEO</button>
        <button class="filter-btn" data-category="E-Commerce & Dropshipping">E-Commerce</button>
        <button class="filter-btn" data-category="Sales & Cold Outreach">Sales</button>
        <button class="filter-btn" data-category="Productivity & Workflows">Productivity</button>
        <button class="filter-btn" data-category="Education & Learning">Education</button>
        <button class="filter-btn" data-category="HR & Recruitment">HR</button>
        <button class="filter-btn" data-category="UI/UX & Product Design">UI/UX</button>
        <button class="filter-btn" data-category="Customer Success & Support">Support</button>
        <button class="filter-btn" data-category="Health, Fitness & Diet">Health</button>
        <button class="filter-btn" data-category="Real Estate">Real Estate</button>
        <button class="filter-btn" data-category="Creative Writing & Books">Writing</button>
        <button class="filter-btn" data-category="Podcasting & Audio">Podcasting</button>
        <button class="filter-btn" data-category="Event Planning">Events</button>
        <button class="filter-btn" data-category="Gaming & World Building">Gaming</button>
    </nav>

    <main class="prompt-container" id="promptContainer">
        </main>

    <div id="toast" class="toast">Prompt Copied!</div>

    <script src="capacitor.js"></script>
    <script src="script.js"></script>
</body>
</html>
