<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Prompt Hub | Professional AI Suite</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="brand"><h1>Prompt Hub</h1></div>
        <button id="authBtn" class="auth-btn">Login</button>
    </header>

    <!-- Search Section -->
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search prompts (e.g. Gaming, Coding)...">
    </div>

    <!-- Navigation Tabs -->
    <div class="app-tabs">
        <button id="tabOfficial" class="tab-btn active">Official</button>
        <button id="tabCommunity" class="tab-btn">Community</button>
    </div>

    <!-- Action Buttons -->
    <button id="openAddPromptBtn" class="add-prompt-btn" style="display:none;">+ Add Expert Prompt</button>

    <!-- Category Filter -->
    <nav class="category-filter" id="categoryFilter">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Coding & Tech">Tech</button>
        <button class="filter-btn" data-category="Marketing & Social Media">Marketing</button>
        <button class="filter-btn" data-category="Gaming & World Building">Gaming</button>
    </nav>

    <!-- Content Area -->
    <main class="prompt-container" id="promptContainer">
        <!-- Prompts load here via JS -->
    </main>

    <!-- Modals -->
    <!-- Auth Modal -->
    <div id="authModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2 id="modalTitle">Login</h2>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Password">
            <button id="submitAuthBtn" class="primary-btn">Login</button>
            <button id="googleAuthBtn" class="google-btn">Sign in with Google</button>
            <p id="toggleAuthMode">Don't have an account? <span>Sign Up</span></p>
        </div>
    </div>

    <!-- Add Prompt Modal -->
    <div id="addPromptModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeAddModal">&times;</span>
            <h2>Add Community Prompt</h2>
            <input type="text" id="promptTitle" placeholder="Title">
            <select id="promptCategory">
                <option value="Coding & Tech">Coding & Tech</option>
                <option value="Gaming & World Building">Gaming & World Building</option>
                <option value="Marketing & Social Media">Marketing</option>
            </select>
            <textarea id="promptDesc" placeholder="Description"></textarea>
            <textarea id="promptText" placeholder="Prompt Text..." rows="5"></textarea>
            <button id="submitPromptBtn" class="primary-btn">Publish Prompt</button>
        </div>
    </div>

    <!-- View Modal -->
    <div id="viewPromptModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" id="closeViewModal">&times;</span>
            <h3 id="viewModalTitle"></h3>
            <p id="viewModalText"></p>
            <button id="copyFromViewBtn" class="primary-btn">Copy Prompt</button>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div id="themeAlertModal" class="modal">
        <div class="modal-content">
            <p id="themeAlertText"></p>
            <button id="themeAlertOkBtn" class="primary-btn">OK</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
