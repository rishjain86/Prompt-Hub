<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Prompt Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <header class="header">
        <div class="brand"><h1>Prompt Hub</h1></div>
        <button id="authBtn" class="auth-btn">Login</button>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search prompts...">
    </div>

    <div class="app-tabs">
        <button id="tabOfficial" class="tab-btn active">Official</button>
        <button id="tabCommunity" class="tab-btn">Community</button>
    </div>

    <button id="openAddPromptBtn" class="add-prompt-btn" style="display:none;">+ Add Expert Prompt</button>

    <nav class="category-filter" id="categoryFilter">
        <button class="filter-btn active" data-category="All">All</button>
        <button class="filter-btn" data-category="Coding & Tech">Coding & Tech</button>
        <button class="filter-btn" data-category="Marketing & Social Media">Marketing</button>
        <button class="filter-btn" data-category="Copywriting & Content">Copywriting</button>
    </nav>

    <main class="prompt-container" id="promptContainer"></main>

    <div id="toast" class="toast">Prompt Copied!</div>

    <div id="authModal" class="modal"><div class="modal-content"><span class="close-modal" id="closeModal">&times;</span><h2 id="modalTitle">Login</h2><input type="email" id="emailInput" placeholder="Email"><input type="password" id="passwordInput" placeholder="Password"><button id="submitAuthBtn" class="primary-btn">Login</button><p id="toggleAuthMode">Sign Up</p></div></div>
    <div id="addPromptModal" class="modal"><div class="modal-content"><span class="close-modal" id="closeAddModal">&times;</span><h2>Add Prompt</h2><input type="text" id="promptTitle" placeholder="Title"><select id="promptCategory"><option value="Coding & Tech">Coding & Tech</option></select><textarea id="promptText" placeholder="Prompt..."></textarea><button id="submitPromptBtn" class="primary-btn">Publish</button></div></div>
    <div id="themeAlertModal" class="modal"><div class="modal-content"><h3 id="alertTitle">Message</h3><p id="themeAlertText"></p><button id="themeAlertOkBtn" class="primary-btn">OK</button></div></div>
    <div id="viewPromptModal" class="modal"><div class="modal-content"><span class="close-modal" id="closeViewModal">&times;</span><h3 id="viewModalTitle"></h3><p id="viewModalText"></p><button id="copyFromViewBtn" class="primary-btn">Copy</button></div></div>

    <script src="script.js"></script>
</body>
</html>
